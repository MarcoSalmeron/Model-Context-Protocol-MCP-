[project]
name = "oci-mcp-client"
version = "0.1.0"
description = "Cliente modular de LangChain para servidores MCP de Oracle Cloud Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=3.4.5",
    "ipython>=9.15.0",
    "langchain>=1.3.13",
    "langchain-core>=1.4.9",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "oci>=2.99.0",
    "requests>=2.31.0",
]

[project.scripts]
oci-mcp-client = "mcp_client.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

